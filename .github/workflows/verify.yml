name: verify
on:
  push:
    paths: ["probe/verify.py"]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/verify.py
      - run: |
          git config user.name probe-bot; git config user.email probe-bot@users.noreply.github.com
          git add probe/verify.txt; git commit -m "verify results [skip ci]"; git pull --rebase -q origin main; git push
