name: probe
on:
  push:
    paths: ["probe/probe.sh", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash probe/probe.sh
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe/out
          git commit -m "probe results [skip ci]" || true
          git push
