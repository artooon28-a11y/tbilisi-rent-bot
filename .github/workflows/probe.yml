name: probe
on:
  push:
    paths: ["probe/myhome_probe.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/myhome_probe.py
      - run: |
          git config user.name probe-bot; git config user.email probe-bot@users.noreply.github.com
          git add probe/myhome_result.txt; git commit -m "probe results [skip ci]"; git pull --rebase -q origin main; git push
