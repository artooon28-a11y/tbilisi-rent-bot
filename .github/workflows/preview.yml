name: preview
# Temporary: runs the bot without Telegram secrets (preview mode) to check sources.
on:
  push:
    paths: ["bot.py", "config.json", ".github/workflows/preview.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-listings
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python bot.py
      - name: Save preview
        if: always()
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          cp state/last_run.log preview_run.log 2>/dev/null || true
          git checkout -- state 2>/dev/null || true
          git add preview.md preview_run.log
          git commit -m "Preview [skip ci]" || exit 0
          git pull --rebase -q origin main
          git push
